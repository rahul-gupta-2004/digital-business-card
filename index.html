              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            <svg id="copied-check-icon" class="w-4 h-4 hidden text-emerald-500" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            <span id="copy-btn-text">Copy</span>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-zinc-200 dark:border-zinc-800"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white dark:bg-zinc-900 px-2.5 text-zinc-400 dark:text-zinc-500 font-medium tracking-wider">
            Quick Share
          </span>
        </div>
      </div>

      <!-- 3. Grid of Quick-Share Icon Buttons -->
      <div class="grid grid-cols-3 gap-2.5">
        <!-- WhatsApp Quick Share -->
        <a id="share-whatsapp" href="#" target="_blank" rel="noopener noreferrer"
          class="group flex flex-col items-center justify-center gap-1.5 p-3 min-h-[58px] rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50/60 dark:bg-zinc-950/60 hover:bg-zinc-100 dark:hover:bg-zinc-800/80 hover:border-zinc-300 dark:hover:border-zinc-700 transition-all active:scale-95 text-zinc-800 dark:text-zinc-200">
          <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-500 transition-transform group-hover:scale-110"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 01-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.53c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.78 2.72 4.31 3.81.6.26 1.07.42 1.44.54.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.12-.22-.19-.47-.32z" />
          </svg>
          <span class="text-xs font-medium tracking-tight">WhatsApp</span>
        </a>

        <!-- LinkedIn Quick Share -->
        <a id="share-linkedin" href="#" target="_blank" rel="noopener noreferrer"
          class="group flex flex-col items-center justify-center gap-1.5 p-3 min-h-[58px] rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50/60 dark:bg-zinc-950/60 hover:bg-zinc-100 dark:hover:bg-zinc-800/80 hover:border-zinc-300 dark:hover:border-zinc-700 transition-all active:scale-95 text-zinc-800 dark:text-zinc-200">
          <svg class="w-5 h-5 text-sky-600 dark:text-sky-500 transition-transform group-hover:scale-110"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
          </svg>
          <span class="text-xs font-medium tracking-tight">LinkedIn</span>
        </a>

        <!-- Email Quick Share -->
        <a id="share-email" href="#" target="_blank" rel="noopener noreferrer"
          class="group flex flex-col items-center justify-center gap-1.5 p-3 min-h-[58px] rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50/60 dark:bg-zinc-950/60 hover:bg-zinc-100 dark:hover:bg-zinc-800/80 hover:border-zinc-300 dark:hover:border-zinc-700 transition-all active:scale-95 text-zinc-800 dark:text-zinc-200">
          <svg class="w-5 h-5 text-zinc-700 dark:text-zinc-300 transition-transform group-hover:scale-110"
            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <span class="text-xs font-medium tracking-tight">Email</span>
        </a>
      </div>

    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    /* ==========================================================================
       DYNAMIC SUBDOMAIN CONFIGURATION
       ========================================================================== */
    const SUBDOMAIN_CONFIG = {
      'default': {
        title: 'Rahul Gupta | AI/ML, Data Engineering & Quantum Computing',
        subtitle: 'AI/ML, Data Engineering & Quantum Computing',
        resume: './resumes/general_resume.pdf'
      },
      'de-': {
        title: 'Rahul Gupta | Data Engineer | Big Data, Streaming & Analytics',
        subtitle: 'Data Engineer | Big Data, Streaming & Analytics',
        resume: './resumes/de_resume.pdf'
      },
      'fsd-': {
        title: 'Rahul Gupta | Full Stack Developer | Scalable Web & Systems',
        subtitle: 'Full Stack Developer | Scalable Web & Systems',
        resume: './resumes/fsd_resume.pdf'
      },
      'qc-': {
        title: 'Rahul Gupta | Quantum Computing Researcher | Qiskit & Variational Algorithms',
        subtitle: 'Quantum Computing Researcher | Qiskit & Variational Algorithms',
        resume: './resumes/qc_resume.pdf'
      },
      'aiml-': {
        title: 'Rahul Gupta | AI & Machine Learning Engineer | Deep Learning & Agents',
        subtitle: 'AI & Machine Learning Engineer | Deep Learning & Agents',
        resume: './resumes/aiml_resume.pdf'
      },
      'qml-': {
        title: 'Rahul Gupta | Quantum AI/ML Researcher | Hybrid Quantum-Classical Models',
        subtitle: 'Quantum AI/ML Researcher | Hybrid Quantum-Classical Models',
        resume: './resumes/qml_resume.pdf'
      },
      'pythondev-': {
        title: 'Rahul Gupta | Python Developer | Backend, Automation & Data Pipelines',
        subtitle: 'Python Developer | Backend, Automation & Data Pipelines',
        resume: './resumes/pythondev_resume.pdf'
      }
    };

    /**
     * Resolves and applies active configuration based on subdomain or ?domain= query param.
     */
    function applyDynamicSubdomainConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      // Query param fallback supports values like ?domain=de, ?domain=de-, ?domain=de-rahul-gupta.runs-on.dev
      const targetHost = (urlParams.get('domain') || window.location.hostname || '').toLowerCase().trim();

      const prefixKeys = ['de-', 'fsd-', 'qc-', 'aiml-', 'qml-', 'pythondev-'];
      let selectedConfig = SUBDOMAIN_CONFIG['default'];

      for (const prefix of prefixKeys) {
        const rawKey = prefix.slice(0, -1); // e.g. "de"
        if (
          targetHost.startsWith(prefix) ||
          targetHost === rawKey ||
          targetHost.startsWith(rawKey + '.') ||
          targetHost.startsWith(rawKey + '-')
        ) {
          selectedConfig = SUBDOMAIN_CONFIG[prefix];
          break;
        }
      }

      // Update Page Title
      document.title = selectedConfig.title;

      // Update Dynamic Subtitle
      const subtitleEl = document.getElementById('profile-subtitle');
      if (subtitleEl) {
        subtitleEl.textContent = selectedConfig.subtitle;
      }

      // Update Resume PDF Link
      const resumeLinkEl = document.getElementById('resume-link');
      if (resumeLinkEl) {
        resumeLinkEl.href = selectedConfig.resume;
      }
    }

    /* ==========================================================================
       THEME CONTROLS (LIGHT / DARK)
       ========================================================================== */
    const themeToggleBtn = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');

    function syncThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDarkNow = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
      syncThemeIcons();
    });

    /* ==========================================================================
       SHARE MODAL DIALOG (SHADCN/UI STYLE)
       ========================================================================== */
    const shareBtn = document.getElementById('share-btn');
    const shareModal = document.getElementById('share-modal');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalContent = document.getElementById('modal-content');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const shareUrlInput = document.getElementById('share-url-input');
    const modalCopyBtn = document.getElementById('modal-copy-btn');
    const copyIcon = document.getElementById('copy-icon');
    const copiedCheckIcon = document.getElementById('copied-check-icon');
    const copyBtnText = document.getElementById('copy-btn-text');

    const shareWhatsapp = document.getElementById('share-whatsapp');
    const shareLinkedin = document.getElementById('share-linkedin');
    const shareEmail = document.getElementById('share-email');

    let copyResetTimeout;

    function populateShareLinks() {
      const currentUrl = window.location.href;

      // Update read-only input
      if (shareUrlInput) {
        shareUrlInput.value = currentUrl;
      }

      const encodedUrl = encodeURIComponent(currentUrl);

      // WhatsApp Quick Share Intent
      if (shareWhatsapp) {
        shareWhatsapp.href = `https://api.whatsapp.com/send?text=Check%20out%20Rahul%20Gupta's%20profile:%20${encodedUrl}`;
      }

      // LinkedIn Quick Share Intent
      if (shareLinkedin) {
        shareLinkedin.href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
      }

      // Email Quick Share Intent
      if (shareEmail) {
        shareEmail.href = `mailto:?subject=Rahul%20Gupta%20-%20Professional%20Profile&body=Check%20out%20this%20profile:%20${encodedUrl}`;
      }
    }

    function openShareModal() {
      populateShareLinks();
      shareModal.classList.remove('opacity-0', 'pointer-events-none');
      shareModal.classList.add('opacity-100', 'pointer-events-auto');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');
      document.body.classList.add('overflow-hidden');
    }

    function closeShareModal() {
      shareModal.classList.remove('opacity-100', 'pointer-events-auto');
      shareModal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-95');
      document.body.classList.remove('overflow-hidden');
      resetCopyButtonState();
    }

    function resetCopyButtonState() {
      clearTimeout(copyResetTimeout);
      if (copyBtnText) copyBtnText.textContent = 'Copy';
      if (copyIcon) copyIcon.classList.remove('hidden');
      if (copiedCheckIcon) copiedCheckIcon.classList.add('hidden');
    }

    function copyShareUrl() {
      const urlToCopy = (shareUrlInput && shareUrlInput.value) ? shareUrlInput.value : window.location.href;

      const notifyCopied = () => {
        if (copyBtnText) copyBtnText.textContent = 'Copied!';
        if (copyIcon) copyIcon.classList.add('hidden');
        if (copiedCheckIcon) copiedCheckIcon.classList.remove('hidden');

        clearTimeout(copyResetTimeout);
        copyResetTimeout = setTimeout(() => {
          resetCopyButtonState();
        }, 2000);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(urlToCopy)
          .then(notifyCopied)
          .catch(() => fallbackCopyInput(urlToCopy, notifyCopied));
      } else {
        fallbackCopyInput(urlToCopy, notifyCopied);
      }
    }

    function fallbackCopyInput(text, callback) {
      if (shareUrlInput) {
        shareUrlInput.select();
        shareUrlInput.setSelectionRange(0, 99999);
      }
      try {
        const successful = document.execCommand('copy');
        if (successful && callback) callback();
      } catch (err) {
        console.error('Fallback copy failed', err);
      }
    }

    // Modal Trigger Listeners
    shareBtn.addEventListener('click', openShareModal);
    modalCloseBtn.addEventListener('click', closeShareModal);
    modalBackdrop.addEventListener('click', closeShareModal);

    // Close on backdrop / outside container click
    shareModal.addEventListener('click', (e) => {
      if (e.target === shareModal) {
        closeShareModal();
      }
    });

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !shareModal.classList.contains('pointer-events-none')) {
        closeShareModal();
      }
    });

    // Copy Button click handler
    modalCopyBtn.addEventListener('click', copyShareUrl);

    /* ==========================================================================
       INITIALIZATION
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Apply Subdomain Configuration
      applyDynamicSubdomainConfig();

      // 2. Sync Theme Toggle Icons
      syncThemeIcons();

      // 3. Pre-fill Share Links
      populateShareLinks();

      // 4. Set Dynamic Year in Footer
      const yearEl = document.getElementById('current-year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }
    });
  </script>
</body>
